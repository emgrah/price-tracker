
name: Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run price tracker
        run: python tracker.py
